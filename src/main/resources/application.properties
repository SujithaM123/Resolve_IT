spring.application.name=resolveit-backend

# --- Oracle -----------------------------------------------------------------
# Connects to the existing Oracle database. The schema is shared with other
# projects, so this application only ever touches its own RESOLVE_ tables.
# To run this on another machine, change only these three lines.
spring.datasource.url=jdbc:oracle:thin:@//127.0.0.1:1521/FREEPDB1
spring.datasource.username=OPSPULSE
spring.datasource.password=K53tFCoVYfjcjVBznbgt4YSus1rF
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.pool-name=ResolveItHikari
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000

# --- JPA / Hibernate --------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Web --------------------------------------------------------------------
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# --- Security ---------------------------------------------------------------
resolveit.security.jwt.secret=resolveit-local-dev-secret-key-at-least-32-bytes-long
resolveit.security.jwt.expiration-minutes=480
resolveit.security.cors.allowed-origins=*

# --- Server -----------------------------------------------------------------
server.port=8080
# Error responses come from GlobalExceptionHandler; never leak internals.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- Logging ----------------------------------------------------------------
logging.level.com.dtcc.intern.demo=INFO

# --- Swagger UI -------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
